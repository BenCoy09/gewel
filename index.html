<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gewel – stories of money, signed by the people who lived them</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 56'%3E%3Crect width='48' height='56' fill='%23123524'/%3E%3Cpath d='M6 6H42L29 28L42 50H6L19 28Z' fill='%23E3A31B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap">
<style>
:root{--bg:#F4F3EC;--ink:#14201A;--mute:#55625A;--forest:#123524;--on-forest:#F4F3EC;--gold:#E3A31B;--on-gold:#14201A;--red:#B23A2A;--line:#C9CCBF;--field:#FFFFFF;
--d:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;--b:"Newsreader",Georgia,serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A13;--ink:#EDEBDD;--mute:#9DAA9F;--forest:#16422C;--line:#2B4034;--field:#14241B;--red:#E5766A}}
:root[data-theme="dark"]{--bg:#0E1A13;--ink:#EDEBDD;--mute:#9DAA9F;--forest:#16422C;--line:#2B4034;--field:#14241B;--red:#E5766A}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.6 var(--b);min-height:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px clamp(16px,5vw,56px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font:800 28px/1 var(--d);letter-spacing:-.02em}
.mark{display:block;overflow:visible}
.cord{stroke:var(--bg);fill:none;stroke-width:1.8;transform-box:fill-box;transform-origin:center;animation:beat 1.1s ease-in-out 3}
.c2{animation-delay:.18s}.c3{animation-delay:.36s}
.brand:hover .cord,.big:hover .cord{animation:beat .5s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.35)}}
.nomotion .cord,.nomotion .cord{animation:none!important}
@media (prefers-reduced-motion:reduce){.cord{animation:none!important}}
nav{display:flex;gap:6px;flex-wrap:wrap;font:600 16px var(--d)}
nav a{padding:8px 12px;text-decoration:none}nav a:hover,nav a[aria-current]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:3px;text-decoration-color:var(--gold)}
nav a.cta{background:var(--gold);color:var(--on-gold)}
main{padding-bottom:64px}
.notice{margin:0;padding:10px clamp(16px,5vw,56px);background:var(--gold);color:var(--on-gold);font:600 16px var(--d)}
.wrap{max-width:860px;margin:0 auto;padding:0 clamp(16px,5vw,32px)}
.hero{background:var(--forest);color:var(--on-forest);padding:clamp(32px,7vw,88px) 0}
.hero .wrap{max-width:1100px;display:grid;grid-template-columns:1.5fr 1fr;gap:32px;align-items:center}
.big{justify-self:center;width:min(100%,260px)}.big .mark{width:100%;height:auto}.big .body{fill:var(--gold)}.big .cord{stroke:var(--forest);stroke-width:1.4}
h1,h2,h3{font-family:var(--d);line-height:1.04;letter-spacing:-.025em;margin:0 0 .5em}
h1{font-size:clamp(38px,7vw,72px);font-weight:800}h2{font-size:clamp(28px,4vw,40px);font-weight:800;margin-top:1.6em}h3{font-size:22px;font-weight:600}
.lead{font-size:clamp(20px,2.6vw,24px);max-width:34ch}
.btn{display:inline-block;font:800 18px var(--d);background:var(--gold);color:var(--on-gold);border:0;padding:14px 24px;cursor:pointer;text-decoration:none;min-height:48px}
.btn.alt{background:transparent;color:inherit;border:2px solid currentColor}
.btn.danger{background:var(--red);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.say{border-left:6px solid var(--gold);padding-left:18px;margin:36px 0;max-width:56ch}
.state{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.state ul{padding-left:1.1em;margin:.4em 0}
label{display:block;font:600 16px var(--d);margin:18px 0 6px}
input,select,textarea{width:100%;font:18px var(--b);padding:12px;border:2px solid var(--ink);background:var(--field);color:var(--ink);border-radius:6px}
textarea{min-height:120px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
.hint{color:var(--mute);font-size:16px;margin:6px 0 0}
.err{color:var(--red);font-weight:600;margin-top:12px}.ok{color:var(--forest);font-weight:600}
:root[data-theme="dark"] .ok{color:var(--gold)}
.entry{border-top:2px solid var(--line);padding:20px 0}
.entry h3{margin:0 0 4px}.meta{color:var(--mute);font-size:16px}
audio{width:100%;margin:10px 0}
details{border-top:2px solid var(--line);padding:14px 0}summary{font:600 20px var(--d);cursor:pointer}
code{font:14px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.rec{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.dot{width:14px;height:14px;background:var(--red);display:none}.live .dot{display:inline-block;animation:beat 1s infinite}
footer{max-width:860px;margin:0 auto;padding:24px clamp(16px,5vw,32px);color:var(--mute);font-size:16px}
.era{display:grid;grid-template-columns:130px 1fr;gap:0 24px;border-left:6px solid var(--gold);padding:8px 0 8px 20px;margin:0 0 28px}.yr{font:800 clamp(34px,7vw,56px)/1 var(--d);letter-spacing:-.03em}.era h2{margin-top:0;font-size:26px}
@media (max-width:720px){.era{grid-template-columns:1fr}.hero .wrap,.state{grid-template-columns:1fr}.big{width:150px;justify-self:start;order:-1}}
</style>
</head>
<body>
<header class="bar"><a class="brand" href="#home" aria-label="Gewel home"><span id="logo"></span>Gewel</a><nav id="nav" aria-label="Main"></nav></header>
<main id="app"></main>
<footer id="ft">Gewel is a hackathon build for the Dakar Bitcoin Hack. Stories are saved on this server and restored with your recovery key.<span id="bd" class="meta"></span></footer>
<script src="/nostr.js"></script>
<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EVENTS=["1994 devaluation of the CFA franc","Savings circle (tontine)","Money sent or received from abroad","Everyday money in my community","A payment that took days","Fees that cost my business","Another moment"];
const LANGS=["Français","English","Wolof","Yorùbá","Hausa","Other"];
const drum=(cls)=>`<svg class="mark ${cls||""}" viewBox="0 0 48 56" aria-hidden="true"><path class="body" fill="currentColor" d="M6 6H42L29 28L42 50H6L19 28Z"/><path class="cord" d="M14 8L21 28L14 48"/><path class="cord c2" d="M24 8V48"/><path class="cord c3" d="M34 8L27 28L34 48"/><rect x="6" y="1" width="36" height="3" fill="#E3A31B"/></svg>`;
$("#logo").innerHTML=drum("").replace('<svg','<svg width="34" height="40"');
/* ---------- storage ---------- */
const open=()=>new Promise((res,rej)=>{const tm=setTimeout(()=>rej(new Error("Browser storage is not responding")),5000);const r=indexedDB.open("gewel",1);r.onblocked=()=>{};r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("stories",{keyPath:"id"})};r.onsuccess=()=>{clearTimeout(tm);res(r.result)};r.onerror=()=>{clearTimeout(tm);rej(r.error)}});
const tx=async(st,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>{d.close();res(q&&q.result)};t.onerror=()=>rej(t.error)})};
const kv={get:k=>tx("kv","readonly",s=>s.get(k)),set:(k,v)=>tx("kv","readwrite",s=>s.put(v,k))};
const stories={all:()=>tx("stories","readonly",s=>s.getAll()),put:o=>tx("stories","readwrite",s=>s.put(o))};
const wipe=async()=>{await tx("kv","readwrite",s=>s.clear());await tx("stories","readwrite",s=>s.clear());try{localStorage.clear()}catch(e){}};
/* ---------- crypto: Nostr (BIP-340 Schnorr), see nostr.js ---------- */
const BUILD="2026-11-19-r6";$("#bd").textContent=" Build "+BUILD;
const sha=async buf=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",buf))].map(x=>x.toString(16).padStart(2,"0")).join("");
const tg=(e,k)=>(e.tags.find(t=>t[0]===k)||[])[1]||"";
async function verifyProof(e,buf){const out={sig:await Nostr.check(e),audio:null};if(buf){const h=await sha(buf);out.audio=h===tg(e,"x")||h===tg(e,"xp")};return out}
/* ---------- state ---------- */
let me=null,keys=null,rec=null;
const prefs=()=>{try{return JSON.parse(localStorage.getItem("gw")||"{}")}catch(e){return{}}};
const savePrefs=p=>{try{localStorage.setItem("gw",JSON.stringify(p))}catch(e){}};
function applyPrefs(){const p=prefs();document.documentElement.lang=p.lang||"en";document.body.classList.toggle("nomotion",!!p.still);if(p.theme)document.documentElement.dataset.theme=p.theme;else delete document.documentElement.dataset.theme}
/* ---------- views ---------- */
const V={
home:()=>`<section class="hero"><div class="wrap"><div><h1>Money has a memory. Keep it in the voices that lived it.</h1>
<p class="lead">In January 1994 the CFA franc lost half its value overnight. The people who paid for that day are rarely the ones who tell it.</p>
<div class="row"><a class="btn" href="#${me?"stories":"join"}">${me?"Record a story":"Start your account"}</a><a class="btn alt" href="#about">How Gewel works</a></div></div>
<div class="big" aria-hidden="true">${drum("")}</div></div></section>
<div class="wrap"><h2>A story you can prove is yours</h2>
<p>Record how money shaped your life or your market. Gewel fingerprints the audio and signs it with a key that never leaves your device. Anyone can check that the recording is unchanged and who signed it.</p>
<div class="say"><p>You can record, sign, verify, keep stories private and receive Lightning tips today. Bitcoin timestamps are requested but only confirmed hours later. The About page says exactly what is still missing.</p></div>
<div class="state"><div><h3>Works today</h3><ul><li>Create an account and a recovery key</li><li>Record or upload a story, signed on your device</li><li>Keep your history after clearing your browser</li><li>Share a link anyone can check</li><li>Receive Lightning tips on every story</li><li>Stories are signed Nostr notes sent to public relays</li><li>Private encrypted stories and a public wall</li><li>Wallet connection with Nostr Wallet Connect</li><li>AI transcript and translation (when the server has a key)</li><li>Bitcoin timestamp requests</li><li>French on the main screens</li><li>Relays you choose</li></ul></div>
<div><h3>Not built yet</h3><ul><li>Bitcoin confirmation checked inside the app</li><li>Full French for every message</li></ul></div></div></div>`,
about:()=>`<div class="wrap"><h1>About Gewel</h1><p class="lead">A gewel is a keeper of a community’s memory. We think that word fits.</p>
<p>African monetary history is mostly written from outside. Gewel lets the people who lived it record it in their own language, own it, and be credited for it.</p>
<h2>What is honest about this version</h2>
<p>Your account is a Nostr key made in your browser. Every story is signed there as a Nostr note, and the server checks each signature before it accepts a story, then sends the note to public Nostr relays and shows you which ones answered. Your recovery key is a standard Nostr nsec, so it restores your account here and works in other Nostr apps. Treat it like a password. By default a story is public to anyone with its link. You can instead keep it private, so the audio is encrypted with a key only you hold, or share it on the public wall. The signed note, with its title and your name, is public either way.</p>
<p>Bitcoin timestamps are requested from public OpenTimestamps servers and stay pending until Bitcoin confirms them. Lightning tips and the wallet need a wallet you connect yourself. Anything not built is marked as such.</p>
<p>The CFA franc facts come from published reporting. Stories are personal accounts, not verified history.</p></div>`,
faq:()=>{const q=[["Do I need an email or phone number?","No. Your account is a signing key made on your device plus a display name you choose."],["What happens if I clear my browser data?","Nothing is lost. Choose Restore on the join page, paste your recovery key, and your stories come back. If you lose the browser data and the recovery key, the account cannot be recovered by anyone."],["What does verified mean?","The audio matches its fingerprint and the signature matches the public key in the proof. It does not prove the story is true."],["Can people hear my story?","Yes, in this version anyone with a story’s link can listen, and the signed note goes to public Nostr relays. Tick “Keep this story private” to encrypt the audio with a key only you hold. The signed note, with its title and your name, still goes to relays either way."],["Which languages can I record in?","Any. You tag the language yourself. Automatic transcription is not part of this version."],["How do tips work?","Add a Lightning address on the Account page. Listeners then get a tip button on your story page and pay from their own wallet. Gewel never holds the money and cannot see whether an invoice was paid."],["What is a Nostr key, and what is an nsec?","Your account is a Nostr key pair. The npub is the public half and is safe to share. The nsec is the private half and is your recovery key: whoever has it can sign as you, so keep it private."],["What does private mean?","The audio is encrypted in your browser with a key only you hold, so the server stores something it cannot play. The title, topic and your name are still public."],["What is the public wall?","A timeline of stories their authors chose to show publicly. Nothing appears there unless you tick the box when saving."],["How do AI transcripts work?","On your own public story you can ask for a transcript with English and French translations from Google’s Gemini service. This sends the story’s audio to Google through the server, so use it only if the storyteller agreed. The result is labelled as machine-made and is not part of your signature. Private stories cannot use it, and it only works if the server has a key."],["Can I use my own wallet?","Yes. The Wallet page connects any Nostr Wallet Connect wallet. Create the connection with a small spending limit."],["Where are my stories stored?","On this Gewel server, and the signed note also goes to public Nostr relays. The Stories page shows which relays answered."],["Is there a Bitcoin timestamp?","Not yet. Stories are signed but not anchored to a Bitcoin block."],["Does Gewel cost anything?","Gewel charges nothing. Your Lightning wallet and any AI service may have their own fees."],["How do I delete everything?","Open Account, then Delete account. It erases your stories from the server and your key from this device."]];
return `<div class="wrap"><h1>Questions</h1>${q.map(([a,b])=>`<details><summary>${a}</summary><p>${b}</p></details>`).join("")}</div>`},
join:()=>me?(location.hash="#stories",""):`<div class="wrap"><h1>Create your account</h1><p class="lead">Two fields. No email, no password.</p>
<form id="f-join" novalidate><label for="n">Name shown on your stories</label><input id="n" maxlength="40" autocomplete="nickname" required>
<label for="l">Language you will record in most</label><select id="l">${LANGS.map(l=>`<option value="${l}">${l}</option>`).join("")}</select>
<p class="hint">Your browser will create a signing key that stays on this device.</p><div id="e" class="err" role="alert"></div>
<div class="row"><button class="btn" type="submit">Create account</button></div></form>
<h2>Restore an account</h2><p>Cleared your browser or using a new device? Paste your recovery key to get your stories back.</p><form id="f-res" novalidate><label for="rc">Recovery key</label><textarea id="rc" spellcheck="false" rows="3"></textarea><div id="e2" class="err" role="alert"></div><div class="row"><button class="btn alt" type="submit">Restore my stories</button></div></form></div>`,
welcome:()=>`<div class="wrap"><h1>Welcome, ${esc(me.name)}</h1><p class="lead">Your key is ready. Here is what happens to a story.</p>
<ol><li>You record or upload audio.</li><li>Gewel computes its fingerprint, a short code that changes if one sound changes.</li><li>Your key signs the fingerprint and the details you typed.</li><li>You get a proof anyone can check on the Verify page.</li></ol>
<h2>Your recovery key</h2><p>Save this key somewhere safe, such as a password manager or a printed note. It restores your account and every story on any device, even after you clear your browser. Anyone who has it can sign as you.</p><textarea id="rk" readonly rows="3" onfocus="this.select()"></textarea><label><input type="checkbox" id="rs" style="width:auto"> I saved my recovery key</label><div class="row"><a class="btn" id="go" href="#stories" aria-disabled="true" style="opacity:.4;pointer-events:none">Record my first story</a></div></div>`,
stories:()=>`<div class="wrap"><h1>Your stories</h1>
<form id="f-story" novalidate><label for="t">Title</label><input id="t" maxlength="90" placeholder="What did that day look like at your stall?">
<label for="ev">What is it about?</label><select id="ev">${EVENTS.map(e=>`<option value="${e}">${e}</option>`).join("")}</select>
<label>Audio</label><div class="rec"><button class="btn alt" type="button" id="rb">Start recording</button><span class="dot"></span><span id="rs" class="meta">No recording yet</span></div>
<label for="up">Or upload an audio file</label><input id="up" type="file"><audio id="pv" controls hidden></audio>
<label><input type="checkbox" id="priv" style="width:auto"> Keep this story private (the audio is encrypted with a key only you hold)</label><label><input type="checkbox" id="pubwall" style="width:auto"> Show it on the public wall</label>
<div id="e" class="err" role="alert"></div><div class="row"><button class="btn" type="submit">Sign and save</button></div></form>
<h2>Saved on this server</h2><div id="list"><p class="meta">Loading…</p></div></div>`,
verify:()=>`<div class="wrap"><h1>Verify a proof</h1><p class="lead">Paste a proof. Add the audio file too to check it has not been changed.</p>
<form id="f-ver" novalidate><label for="pj">Proof</label><textarea id="pj" spellcheck="false"></textarea><label for="pa">Audio file (optional)</label><input id="pa" type="file">
<div class="row"><button class="btn" type="submit">Check proof</button></div><div id="vr" aria-live="polite"></div></form></div>`,
account:()=>{const p=prefs();return `<div class="wrap"><h1>Account</h1>
<p class="meta">Your Nostr public key <code id="npub"></code></p>
<h2>Edit profile</h2><form id="f-edit"><label for="n">Display name</label><input id="n" maxlength="40" value="${esc(me.name)}"><label for="l">Main language</label><select id="l">${LANGS.map(l=>`<option value="${l}"${l===me.lang?" selected":""}>${l}</option>`).join("")}</select><div id="e" class="err" role="alert"></div><div class="row"><button class="btn" type="submit">Save changes</button></div></form>
<h2>Settings</h2><label for="th">Colour theme</label><select id="th"><option value="">Match my device</option><option value="light"${p.theme==="light"?" selected":""}>Light</option><option value="dark"${p.theme==="dark"?" selected":""}>Dark</option></select>
<label><input type="checkbox" id="st" style="width:auto"${p.still?" checked":""}> Keep the logo still</label>
<h2>Lightning tips</h2><p>Add a Lightning address and every story page offers a tip button. Listeners pay from their own wallet and the sats go straight to you. Gewel never holds money. Leave it empty to turn tips off.</p><form id="f-ln"><label for="ln">Lightning address</label><input id="ln" placeholder="name@wallet.com" autocomplete="off"><div id="lne" class="err" role="alert"></div><div class="row"><button class="btn" type="submit">Save</button></div></form>
<h2>Relays</h2><p>Your story notes are sent to these relays. One wss:// address per line. Leave empty to use the server’s defaults.</p><form id="f-rl"><textarea id="rl" rows="3" spellcheck="false" placeholder="wss://relay.example.com"></textarea><div id="rle" class="hint" role="alert"></div><div class="row"><button class="btn" type="submit">Save relays</button></div></form>
<h2>Recovery key</h2><p>This key restores your account on any device. Keep it private.</p><textarea id="rk2" readonly rows="3" hidden onfocus="this.select()"></textarea><div class="row"><button class="btn alt" type="button" id="rkb">Show recovery key</button></div>
<h2>Delete account</h2><p>This erases every story you saved from this server and your key from this device, and asks Nostr relays to delete their copies. Relays can ignore that request, so copies already published may remain. It cannot be undone, and your links stop working.</p>
<form id="f-del"><label for="dc">Type your name (${esc(me.name)}) to confirm</label><input id="dc" autocomplete="off"><div class="row"><button class="btn danger" id="db" disabled>Delete account</button></div></form></div>`}};
const api=async(u,o)=>{const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed");return j};
const post=(u,ev)=>api(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(ev)});
async function toWav(buf){const ac=new (window.AudioContext||window.webkitAudioContext)(),d=await ac.decodeAudioData(buf.slice(0));ac.close();const oc=new OfflineAudioContext(1,Math.ceil(d.duration*16000),16000),src=oc.createBufferSource();src.buffer=d;src.connect(oc.destination);src.start();
  const r=(await oc.startRendering()).getChannelData(0),w=new DataView(new ArrayBuffer(44+r.length*2)),s=(o,t)=>[...t].forEach((x,i)=>w.setUint8(o+i,x.charCodeAt(0)));
  s(0,"RIFF");w.setUint32(4,36+r.length*2,true);s(8,"WAVEfmt ");w.setUint32(16,16,true);w.setUint16(20,1,true);w.setUint16(22,1,true);w.setUint32(24,16000,true);w.setUint32(28,32000,true);w.setUint16(32,2,true);w.setUint16(34,16,true);s(36,"data");w.setUint32(40,r.length*2,true);
  r.forEach((v,i)=>w.setInt16(44+i*2,Math.max(-1,Math.min(1,v))*32767,true));return w.buffer}

      try{await post("/api/delete",await Nostr.event(keys.sk,5,[["e",b.dataset.del]],"Deleted on Gewel"));render()}catch(e){b.disabled=false;b.textContent="Delete this story";alert("Could not delete: "+e.message)}});
    document.querySelectorAll("[data-play]").forEach(b=>b.onclick=async()=>{const p=a.find(x=>x.id===b.dataset.play);b.disabled=true;b.textContent="Decrypting…";try{const r=await fetch("/api/audio/"+p.id),pt=await Nostr.open(keys.sk,new Uint8Array(await r.arrayBuffer()),tg(p,"iv")),au=document.createElement("audio");au.controls=true;au.src=URL.createObjectURL(new Blob([pt],{type:tg(p,"mime")||"audio/webm"}));b.replaceWith(au)}catch(e){b.disabled=false;b.textContent="Could not decrypt: "+e.message}});
    a.forEach(p=>api("/api/relays/"+p.id).then(j=>{const el=$(`[data-r="${p.id}"]`);if(el)el.textContent="Public Nostr relays: "+(Object.keys(j).length?Object.entries(j).map(([u,s])=>u.replace(/^wss?:\/\//,"")+" "+s).join("; "):"no report yet (server restarted)")}).catch(()=>{}))
  }).catch(e=>{$("#list").innerHTML='<p class="err">Could not load your stories: '+esc(e.message)+'</p>'})},
verify(){$("#f-ver").onsubmit=async ev=>{ev.preventDefault();const o=$("#vr");let p;
  try{p=JSON.parse($("#pj").value);if(!p.sig||!p.id||!Array.isArray(p.tags))throw 0}catch(e){o.innerHTML='<p class="err">That is not a signed Nostr event. Paste the full text, starting with {.</p>';return}
  const f=$("#pa").files[0];const r=await verifyProof(p,f?await f.arrayBuffer():null);
  o.innerHTML=`<p class="${r.sig?"ok":"err"}">${r.sig?"The Nostr signature is valid for this event.":"The signature does not match this event."}</p>`+
  (r.audio===null?'<p class="hint">Add the audio file to check it matches the fingerprint.</p>':`<p class="${r.audio?"ok":"err"}">${r.audio?"The audio matches the fingerprint.":"This audio is different from the one that was signed."}</p>`)+
  `<p class="meta">Signed by “${esc(tg(p,"author")||"unknown")}” about “${esc(tg(p,"title"))}”. Signed does not mean true.</p>`}},
account(){
  $("#npub").textContent=Nostr.enc("npub",me.pk);
  $("#f-edit").onsubmit=async ev=>{ev.preventDefault();const n=$("#n").value.trim();if(n.length<2){$("#e").textContent="Enter a name of at least 2 characters.";return}
    me={...me,name:n,lang:$("#l").value};await kv.set("profile",me);$("#e").className="ok";$("#e").textContent="Saved."};
  api("/api/ln?pk="+me.pk).then(j=>{$("#lne").className="hint";$("#lne").textContent=j.enabled?"Tips are on for your stories.":"Tips are off."}).catch(()=>{});
  $("#f-ln").onsubmit=async ev=>{ev.preventDefault();const o=$("#lne");
    try{const j=await post("/api/ln",await Nostr.event(keys.sk,30078,[["d","gewel-lightning"]],$("#ln").value.trim()));o.className="ok";o.textContent=j.enabled?"Saved. Tips are on.":"Tips are off."}
    catch(e){o.className="err";o.textContent=e.message}};
  kv.get("relays").then(l=>{$("#rl").value=(l||[]).join("\n")});
  $("#f-rl").onsubmit=async ev=>{ev.preventDefault();const o=$("#rle"),l=$("#rl").value.split(/\s+/).filter(Boolean);
    if(l.length>5||l.some(u=>!/^wss:\/\/[^\s]+$/.test(u))){o.className="err";o.textContent="Use up to 5 addresses that start with wss://";return}await kv.set("relays",l);o.className="ok";o.textContent=l.length?"Saved. New stories go to these relays.":"Saved. New stories use the server’s relays."};
  $("#th").onchange=e=>{const p=prefs();p.theme=e.target.value;savePrefs(p);applyPrefs()};
  $("#st").onchange=e=>{const p=prefs();p.still=e.target.checked;savePrefs(p);applyPrefs()};
  $("#rkb").onclick=()=>{const t=$("#rk2");t.value=Nostr.enc("nsec",keys.sk);t.hidden=false};
  $("#dc").oninput=e=>{$("#db").disabled=e.target.value.trim()!==me.name};
  $("#f-del").onsubmit=async ev=>{ev.preventDefault();if($("#dc").value.trim()!==me.name)return;
    try{const{stories:a}=await api("/api/stories?pk="+me.pk);for(const s of a)await post("/api/delete",await Nostr.event(keys.sk,5,[["e",s.id]],"Deleted on Gewel"))}
    catch(e){alert("Could not erase your stories from the server, so your account was not deleted: "+e.message);return}await wipe();me=null;keys=null;applyPrefs();location.hash="#home";render()}}
};
BIND.wall=()=>api("/api/wall").then(({stories:a})=>{const card=p=>`<div class="entry"><h3>${esc(tg(p,"title"))}</h3><div class="meta">${esc(tg(p,"author"))}, ${esc(tg(p,"lang"))}, ${new Date(p.created_at*1000).toLocaleDateString()}</div><audio controls preload="none" src="/api/audio/${p.id}"></audio><p><a href="/s/${p.id}">Open verification link</a></p></div>`;
  const used=new Set(),sec=MARKS.map(m=>{const mine=a.filter(p=>tg(p,"topic").includes(m.y));mine.forEach(p=>used.add(p.id));return`<section class="era"><div class="yr">${m.y}</div><div><h2>${m.t}</h2><p>${m.d}</p>${mine.map(card).join("")||'<p class="meta">No stories shared for this moment yet.</p>'}</div></section>`}),rest=a.filter(p=>!used.has(p.id));
  $("#wl").className="";$("#wl").innerHTML=sec.join("")+`<section class="era"><div class="yr">Now</div><div><h2>Money in everyday life</h2>${rest.map(card).join("")||'<p class="meta">Nothing shared here yet. Record a story and choose “Show it on the public wall.”</p>'}</div></section>`}).catch(e=>{$("#wl").innerHTML='<p class="err">Could not load the wall: '+esc(e.message)+'</p>'});
BIND.wallet=async()=>{const uriOf=()=>kv.get("nwc"),sats=m=>Math.floor(m/1000),amt=pr=>{const m=String(pr).toLowerCase().match(/^lnbc(\d+)([munp]?)1/);return m?Math.round(m[1]*({"":1e11,m:1e8,u:1e5,n:100,p:.1}[m[2]])/1000):null};
  const show=async()=>{const u=await uriOf();$("#wp").hidden=!u;if(!u)return;$("#bal").textContent="Asking the wallet…";try{const r=await Nostr.nwc(u,"get_balance");$("#bal").textContent=sats(r.balance).toLocaleString()+" sats"}catch(e){$("#bal").textContent="Could not read the balance: "+e.message}};
  $("#f-nwc").onsubmit=async ev=>{ev.preventDefault();const v=$("#nu").value.trim(),o=$("#ne");try{await Nostr.nwc(v,"get_balance");await kv.set("nwc",v);$("#nu").value="";o.textContent="";show()}catch(e){o.textContent=e.message}};
  $("#nx").onclick=async()=>{await kv.set("nwc",null);$("#wp").hidden=true};$("#rf").onclick=show;
  $("#f-rcv").onsubmit=async ev=>{ev.preventDefault();const o=$("#ri");o.textContent="Asking the wallet…";try{const r=await Nostr.nwc(await uriOf(),"make_invoice",{amount:Number($("#ra").value)*1000,description:"Gewel"});o.innerHTML='<textarea readonly rows="4" onfocus="this.select()">'+esc(r.invoice)+'</textarea>'}catch(e){o.innerHTML='<p class="err">Could not create an invoice: '+esc(e.message)+'</p>'}};
  $("#f-pay").onsubmit=async ev=>{ev.preventDefault();const pr=$("#pi").value.trim(),o=$("#po"),n=amt(pr);if(n===null){o.innerHTML='<p class="err">This invoice has no amount, or it is not a Bitcoin invoice. Gewel only pays invoices that state an amount.</p>';return}
    if(!confirm("Pay "+n.toLocaleString()+" sats from your wallet?"))return;o.textContent="Sending…";try{const r=await Nostr.nwc(await uriOf(),"pay_invoice",{invoice:pr});o.innerHTML='<p class="ok">The wallet confirmed the payment.</p><p class="meta">Preimage <code>'+esc(r.preimage||"not returned")+'</code></p>';show()}catch(e){o.innerHTML='<p class="err">Payment failed: '+esc(e.message)+'</p>'}};
  show()};
const fail=e=>{$("#app").innerHTML='<div class="wrap"><h1>Gewel could not load this page</h1><p class="err">'+esc((e&&e.message)||e)+'</p><p>Reload the page. If it keeps happening, open the site in a private tab and tell the developer the message above.</p></div>'};
addEventListener("error",ev=>{if(!$("#app").innerHTML.trim())fail(ev.error||ev.message)});addEventListener("unhandledrejection",ev=>{if(!$("#app").innerHTML.trim())fail(ev.reason)});
addEventListener("hashchange",render);
(async()=>{applyPrefs();try{me=await kv.get("profile")||null;keys=await kv.get("keys")||null;if(!keys||!keys.sk||!me||!me.pk)me=null}catch(e){me=null}try{await render()}catch(e){fail(e)}})();
</script>
</body>
</html>
